  const pre = f.trim().startsWith('"') ? lit[0] || "" : (/^\s*[£$€]/.test(f) ? f.trim()[0] : (f.includes("£") && f.indexOf("£") < f.search(/[#0]/) ? "£" : ""));
  const post = pct ? "%" : ((f.trim().endsWith('"') && !f.trim().startsWith('"')) ? lit[lit.length - 1] : "");
  const neg = v < 0 && !sec[1] ? "-" : "";
  return neg + pre + s + post;
}

// ---------------------------------------------------------------- grid
let cur = null, zoom = 1, sel = null;
function styleCss(st) {
  const o = [];
  if (st.b) o.push("font-weight:700"); if (st.i) o.push("font-style:italic"); if (st.u) o.push("text-decoration:underline");
  if (st.sz) o.push(`font-size:${(st.sz * 4 / 3).toFixed(1)}px`);

  for (const [k, side] of [["bt", "top"], ["bb", "bottom"], ["bl", "left"], ["br", "right"]]) if (st[k]) o.push(`border-${side}:${st[k][0]}px solid ${st[k][1]}`);
  return o.join(";");
}
function render(name) {
  cur = sheets[name];

  }

  h += `<thead><tr><th class="rn"></th>${cols.map((w, i) => `<th${w ? "" : ' style="display:none"'}>${colName(i + 1)}</th>`).join("")}</tr></thead><tbody>`;
  for (const r of s.rows) {

    const ht = s.heights[r];

    for (let c = 1; c <= cols.length; c++) {

      const cell = s.cells[k], sp = span.get(k);

      const st = cell ? M.styles[cell[2]] : {};

      const cls = [];
      if (cell && cell[3]) cls.push("inp");

      if (st.wr || (sp && sp[0] > 1)) cls.push("wr");
      h += `<td data-k="${k}"${rs > 1 ? ` rowspan="${rs}"` : ""}${cs > 1 ? ` colspan="${cs}"` : ""}${cls.length ? ` class="${cls.join(" ")}"` : ""} style="${css}"></td>`;
    }
    h += "</tr>";
  }

}
function paint() {
  memo = new Map();

    const k = td.dataset.k, cell = cur.cells[k];

function select(td, keep) {

function edit(td) {

      if (t === "") { if (cell[0] === null) delete edits[key]; else edits[key] = null; }
      else if (!isNaN(Number(t))) { const n = Number(t); if (n === cell[0]) delete edits[key]; else edits[key] = n; }

function move(td, dr, dc) {

document.addEventListener("keydown", e => {

});
function setZoom(z) { zoom = Math.min(2, Math.max(0.4, z)); document.getElementById("zoomer").style.transform = `scale(${zoom})`;
  const g = document.getElementById("grid"); document.getElementById("zoomer").style.width = g.offsetWidth * zoom + "px"; document.getElementById("zoomer").style.height = g.offsetHeight * zoom + "px";

tabs.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { sel = null; render(b.dataset.s); document.getElementById("wrap").scrollTo(0, 0); setZoom(zoom); } });
